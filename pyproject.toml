[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fg-strategy-modelling-core"
version = "0.1.0"
description = "ForexGrand strategy modelling core library for ML model training on forex data"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ForexGrand Team", email = "dev@forexgrand.com"}
]
keywords = [
    "forex",
    "machine-learning",
    "deep-learning",
    "tensorflow",
    "trading",
    "strategy",
    "timeseries"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "boto3>=1.34.0,<2.0.0",
    "tensorflow>=2.21.0,<2.22.0",
    "pydantic>=2.0.0,<3.0.0",
    "keras>=3.13.2,<3.14.1",
    "xgboost-cpu>=3.2.0,<3.3.0",
    "torch>=2.10.0,<2.20.0",
    "shap>=0.52.0,<0.53.0",
    "openfe>=0.0.12,<0.0.13",
    "imbalanced-learn>=0.14.2,<0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]
aws = [
    "boto3>=1.34.0,<2.0.0",
]
gcs = [
    "google-cloud-storage>=2.10.0",
]
cloudflare = [
    "boto3>=1.34.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/forexgrand/fg-strategy-modelling-core"
Repository = "https://github.com/forexgrand/fg-strategy-modelling-core.git"
Documentation = "https://fg-strategy-modelling-core.readthedocs.io"
"Bug Tracker" = "https://github.com/forexgrand/fg-strategy-modelling-core/issues"

[tool.setuptools]
packages = ["fgmodeller"]

[tool.setuptools.package-dir]
fgmodeller = "src"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
py_version = 39

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]
