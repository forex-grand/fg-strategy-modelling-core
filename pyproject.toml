[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fg-strategy-modelling-core"
version = "0.2.1"
description = "ForexGrand strategy modelling core library for ML model training on forex data | financial price data"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "ForexGrand Team", email = "kadiabdulkudus@gmail.com"}
]
keywords = [
    "forex",
    "machine-learning",
    "deep-learning",
    "tensorflow",
    "trading",
    "strategy",
    "timeseries"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "setuptools>=70.0,<81.0",
    "boto3>=1.34.0,<2.0.0",
    "tensorflow>=2.21.0,<2.22.0",
    "pydantic>=2.0.0,<3.0.0",
    "keras>=3.13.2,<3.14.1",
    "keras-tuner>=1.4.7,<2.0.0",
    "xgboost-cpu>=3.2.0,<3.3.0",
    "optuna>=4.0.0,<5.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "torch>=2.10.0,<2.20.0",
    "shap>=0.52.0,<0.53.0",
    "openfe>=0.0.12,<0.0.13",
    "imbalanced-learn>=0.14.2,<0.15.0",
]

[project.scripts]
fg_core = "forexgrand_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]
aws = [
    "boto3>=1.34.0,<2.0.0",
]
gcs = [
    "google-cloud-storage>=2.10.0",
]
cloudflare = [
    "boto3>=1.34.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/forex-grand/fg-strategy-modelling-core"
Repository = "https://github.com/forex-grand/fg-strategy-modelling-core.git"
Documentation = "https://github.com/forex-grand/fg-strategy-modelling-core"
"Bug Tracker" = "https://github.com/forex-grand/fg-strategy-modelling-core/issues"

[tool.setuptools]
packages = {find = {include = ["forexgrand_core", "forexgrand_core.*"]}}

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
py_version = 39

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=forexgrand_core --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["forexgrand_core"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]
